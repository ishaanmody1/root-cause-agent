[project]
name = "rootcause"
version = "0.1.0"
description = "Root-cause diagnosis agent for a multi-stage production line: simulator, anomaly detection, LLM diagnosis agent, evals."
readme = "README.md"
authors = [
    { name = "Ishaan Mody", email = "ishaanmody1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.80",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
realdata = ["pyarrow>=16"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
rootcause = "rootcause.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
